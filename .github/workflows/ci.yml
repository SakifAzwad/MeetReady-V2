name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real PostgreSQL for the race tests (src/server/booking.race.test.ts).
    # PGlite covers everything else but is a single connection, so it can't
    # run two transactions at once.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Fails if someone edited schema.ts but forgot to commit the migration.
      - name: Migrations are up to date
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name=ci-drift-check
          test -z "$(git status --porcelain drizzle/)" || (git status drizzle/ && exit 1)

  # End-to-end: the production build in a real browser against a real Postgres
  # (playwright.config.ts). Runs beside `check`, so a push waits for the slower
  # of the two, not both in a row. This is also the job that proves
  # `next build` still works.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetready_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Chromium build pinned by @playwright/test, plus the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # On failure: the HTML report, screenshots and traces (open a trace with
      # `npx playwright show-trace trace.zip` to replay the test step by step).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
