name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Fails if someone edited schema.ts but forgot to commit the migration.
      - name: Migrations are up to date
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name=ci-drift-check
          test -z "$(git status --porcelain drizzle/)" || (git status drizzle/ && exit 1)
